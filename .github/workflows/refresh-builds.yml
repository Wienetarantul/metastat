name: Обновить закупы из STRATZ

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Собрать закупы
        env:
          STRATZ_TOKEN: ${{ secrets.STRATZ_TOKEN }}
        run: |
          printf 'STRATZ_TOKEN=%s\n' "$STRATZ_TOKEN" > .env
          node scripts/fetch-builds.mjs
          rm -f .env
      - name: Закоммитить изменения
        run: |
          git config user.name "MetaStat bot"
          git config user.email "actions@github.com"
          git add webapp/public/builds
          git diff --staged --quiet || git commit -m "Еженедельное обновление закупов"
          git push
